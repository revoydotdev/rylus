<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rylus Settings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #fff; }
        h2 { font-size: 1.1rem; margin: 1.5rem 0 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
        .field { margin-bottom: 0.75rem; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.25rem; }
        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%; padding: 0.5rem 0.75rem; background: #16213e; border: 1px solid #333; border-radius: 4px;
            color: #e0e0e0; font-size: 0.95rem; outline: none;
        }
        input:focus { border-color: #4a6fa5; }
        .checkbox-field { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .checkbox-field input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4a6fa5; }
        .checkbox-field label { margin: 0; color: #e0e0e0; }
        .btn { padding: 0.6rem 1.5rem; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; }
        .btn-primary { background: #4a6fa5; color: #fff; }
        .btn-primary:hover { background: #5a7fb5; }
        .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
        .actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; align-items: center; }
        .status { font-size: 0.85rem; color: #6a6; margin-left: 0.5rem; }
        .status.error { color: #c66; }
        .info { font-size: 0.85rem; color: #888; margin-top: 0.25rem; }
        .server-url { margin-top: 1rem; padding: 0.75rem; background: #16213e; border-radius: 4px; font-family: monospace; font-size: 0.95rem; word-break: break-all; }
        .server-url a { color: #6a9fd5; text-decoration: none; }
        .server-url a:hover { text-decoration: underline; }
        .section { background: #16213e; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Rylus Settings</h1>

    <div class="section">
        <h2>Server</h2>
        <div class="field">
            <label for="bind_address">Bind Address</label>
            <input type="text" id="bind_address" value="0.0.0.0">
        </div>
        <div class="field">
            <label for="web_port">Port</label>
            <input type="number" id="web_port" value="1701" min="1" max="65535">
        </div>
        <div class="field">
            <label for="access_code">Access Code</label>
            <input type="password" id="access_code" placeholder="(none)">
            <div class="info">If set, clients need this code to connect. NOT encrypted.</div>
        </div>
    </div>

    <div class="section">
        <h2>Hardware Acceleration</h2>
        <div class="checkbox-field">
            <input type="checkbox" id="try_vaapi">
            <label for="try_vaapi">VAAPI (Linux)</label>
        </div>
        <div class="checkbox-field">
            <input type="checkbox" id="try_nvenc">
            <label for="try_nvenc">NVENC (Nvidia GPU)</label>
        </div>
        <div class="checkbox-field">
            <input type="checkbox" id="try_videotoolbox">
            <label for="try_videotoolbox">VideoToolbox (macOS)</label>
        </div>
        <div class="checkbox-field">
            <input type="checkbox" id="try_mediafoundation">
            <label for="try_mediafoundation">MediaFoundation (Windows)</label>
        </div>
        <div class="info">Hardware acceleration may improve performance but can be unstable on some systems.</div>
    </div>

    <div class="section" id="linux_section" style="display:none">
        <h2>Linux</h2>
        <div class="checkbox-field">
            <input type="checkbox" id="wayland_support">
            <label for="wayland_support">Wayland/PipeWire Support (experimental)</label>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="save_btn" onclick="saveConfig()">Save &amp; Restart</button>
        <span class="status" id="status"></span>
    </div>

    <div class="server-url" id="server_url" style="display:none">
        Client URL: <a id="client_link" href="#" target="_blank"></a>
    </div>
</div>

<script>
    async function loadConfig() {
        try {
            const resp = await fetch('/api/config');
            if (!resp.ok) throw new Error('Failed to load config');
            const config = await resp.json();

            document.getElementById('bind_address').value = config.bind_address || '0.0.0.0';
            document.getElementById('web_port').value = config.web_port || 1701;
            document.getElementById('access_code').value = config.access_code || '';
            document.getElementById('try_vaapi').checked = !!config.try_vaapi;
            document.getElementById('try_nvenc').checked = !!config.try_nvenc;
            document.getElementById('try_videotoolbox').checked = !!config.try_videotoolbox;
            document.getElementById('try_mediafoundation').checked = !!config.try_mediafoundation;
            document.getElementById('wayland_support').checked = !!config.wayland_support;

            if (config.platform === 'linux') {
                document.getElementById('linux_section').style.display = '';
            }

            updateClientUrl();
            document.getElementById('web_port').addEventListener('input', updateClientUrl);
        } catch (e) {
            showStatus('Failed to load config: ' + e.message, true);
        }
    }

    async function saveConfig() {
        const btn = document.getElementById('save_btn');
        btn.disabled = true;
        showStatus('Saving...');

        const port = parseInt(document.getElementById('web_port').value);
        if (isNaN(port) || port < 1 || port > 65535) {
            showStatus('Port must be between 1 and 65535.', true);
            btn.disabled = false;
            return;
        }
        const config = {
            bind_address: document.getElementById('bind_address').value,
            web_port: port,
            access_code: document.getElementById('access_code').value || null,
            try_vaapi: document.getElementById('try_vaapi').checked,
            try_nvenc: document.getElementById('try_nvenc').checked,
            try_videotoolbox: document.getElementById('try_videotoolbox').checked,
            try_mediafoundation: document.getElementById('try_mediafoundation').checked,
            wayland_support: document.getElementById('wayland_support').checked,
        };

        try {
            const resp = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config),
            });
            if (!resp.ok) {
                const text = await resp.text();
                throw new Error(text || 'Failed to save config');
            }
            showStatus('Saved. Config will apply on next restart.');
        } catch (e) {
            showStatus('Error: ' + e.message, true);
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(msg, isError) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = 'status' + (isError ? ' error' : '');
    }

    function updateClientUrl() {
        const port = document.getElementById('web_port').value;
        const url = window.location.protocol + '//' + window.location.hostname + ':' + port;
        const el = document.getElementById('server_url');
        const link = document.getElementById('client_link');
        link.href = url;
        link.textContent = url;
        el.style.display = '';
    }

    loadConfig();
</script>
</body>
</html>
