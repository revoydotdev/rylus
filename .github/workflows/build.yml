name: Build

on:
  push:
    branches: [ '*' ]
    tags:
      - v*
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - run: npm install
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        components: clippy, rustfmt
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-quality-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Rustfmt
      run: cargo fmt -- --check
    - name: Cargo test
      run: cargo test --workspace --locked
    - name: Self-test
      run: cargo run -q -p rylus-server -- --self-test
    - name: Encode benchmark regression gate
      run: ./scripts/bench-gate.sh
    - name: Frontend unit tests
      run: npm test
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Audit
      run: cargo audit

  # ---------------------------------------------------------------------------
  # Per-OS smoke tests: build rylus-server, run --self-test, gate releases.
  # TestCapturable provides a synthetic pixel source so no real display,
  # X11 connection, or PipeWire daemon is required on any platform.
  # ---------------------------------------------------------------------------

  smoke-linux:
    needs: quality
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - run: npm install && npm run build
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-smoke-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Build rylus-server
      run: cargo build -p rylus-server
    - name: Self-test
      run: ./target/debug/rylus --self-test

  smoke-macos:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, macos, x64]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Build and self-test
      run: |
        source "$HOME/.cargo/env"
        eval "$(/usr/local/bin/brew shellenv zsh)"
        npm install && npm run build
        cargo build -p rylus-server
        ./target/debug/rylus --self-test

  smoke-windows:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, windows, x64]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: x86_64-pc-windows-msvc
    - run: npm install
    - name: Build frontend
      run: npm run build
    - name: Build rylus-server
      run: cargo build -p rylus-server --target x86_64-pc-windows-msvc
      env:
        FFMPEG_DIR: C:\ffmpeg-win64
    - name: Self-test
      run: .\target\x86_64-pc-windows-msvc\debug\rylus.exe --self-test
      env:
        FFMPEG_DIR: C:\ffmpeg-win64

  # ---------------------------------------------------------------------------
  # Release builds — each depends on its smoke job so a failing self-test
  # blocks artifact upload and GitHub release publication.
  # ---------------------------------------------------------------------------

  build-linux:
    needs: [quality, smoke-linux]
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Install cargo-deb
      run: cargo install cargo-deb
    - name: Build
      run: ./docker_build.sh
      shell: bash
    - name: Artifacts1
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: linux
        path: packages/rylus-linux.zip
    - name: Artifacts2
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: linux-deb
        path: packages/rylus*.deb
    - name: Publish
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            packages/rylus-linux.zip
            packages/rylus*.deb
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-alpine:
    needs: [quality, smoke-linux]
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Build Alpine container
      run: docker build -t rylus-alpine-build -f docker/Dockerfile_alpine .
    - name: Build in container
      run: |
        docker run --rm -v ${{ github.workspace }}:/build -w /build \
          -e CARGO_HOME=/build/.cargo-docker \
          -e npm_config_cache=/build/.npm-cache \
          --user "$(id -u):$(id -g)" \
          rylus-alpine-build \
          sh -c "npm install && RUSTFLAGS='-C target-feature=-crt-static' cargo build --release && cd target/release && tar czf rylus-linux-alpine-musl.tar.gz rylus"
    - name: Artifacts1
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: linux-alpine-musl
        path: target/release/rylus-linux-alpine-musl.tar.gz
    - name: Publish
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/rylus-linux-alpine-musl.tar.gz
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: [quality, smoke-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, macos, x64]
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 != '' }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Build
      run: |
        source "$HOME/.cargo/env"
        eval "$(/usr/local/bin/brew shellenv zsh)"
        rustup target add x86_64-apple-darwin aarch64-apple-darwin
        npm install
        cargo build --release --package rylus-server --target x86_64-apple-darwin
        cargo build --release --package rylus-server --target aarch64-apple-darwin
        cargo bundle --release --package rylus-server
    - name: Merge universal binary
      run: |
        lipo -create -output target/rylus-universal \
          target/x86_64-apple-darwin/release/rylus \
          target/aarch64-apple-darwin/release/rylus
        cp target/rylus-universal target/release/bundle/osx/Rylus.app/Contents/MacOS/rylus
    - name: Package
      run: |
        cd target/release/bundle/osx
        zip -r macos-universal.zip Rylus.app
    # -------------------------------------------------------------------------
    # Codesign / notarize / DMG steps below are gated on APPLE_DEVELOPER_ID_CERT_P12
    # being present. Real cert provisioning (Apple Developer Program enrollment,
    # exporting the .p12, populating the secrets) is tracked separately in
    # TODOS.md section 2 — until then these steps are skipped and the job still
    # completes green, publishing only the unsigned zip.
    - name: Import signing certificate
      if: env.HAS_APPLE_SIGNING == 'true'
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
        P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      run: |
        CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/rylus-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
    - name: Codesign app bundle
      if: env.HAS_APPLE_SIGNING == 'true'
      run: |
        codesign --sign "Developer ID Application" \
          --options=runtime --timestamp \
          --entitlements packaging/macos/entitlements.plist \
          --deep --force \
          target/release/bundle/osx/Rylus.app
    - name: Notarize and staple app bundle
      if: env.HAS_APPLE_SIGNING == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      run: |
        cd target/release/bundle/osx
        ditto -c -k --keepParent Rylus.app Rylus-app-notarize.zip
        xcrun notarytool submit Rylus-app-notarize.zip \
          --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" \
          --wait
        xcrun stapler staple Rylus.app
        rm -f Rylus-app-notarize.zip
    - name: Build DMG
      if: env.HAS_APPLE_SIGNING == 'true'
      run: |
        version="${GITHUB_REF_NAME#v}"
        brew install create-dmg
        cd target/release/bundle/osx
        create-dmg --overwrite --no-code-sign \
          "Rylus.app" .
        mv "Rylus "*.dmg "Rylus-${version}-universal.dmg"
    - name: Notarize and staple DMG
      if: env.HAS_APPLE_SIGNING == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        cd target/release/bundle/osx
        xcrun notarytool submit "Rylus-${version}-universal.dmg" \
          --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" \
          --wait
        xcrun stapler staple "Rylus-${version}-universal.dmg"
    - name: Artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: macos-universal
        path: target/release/bundle/osx/macos-universal.zip
    - name: Artifacts (dmg)
      if: env.HAS_APPLE_SIGNING == 'true'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: macos-universal-dmg
        path: target/release/bundle/osx/Rylus-*-universal.dmg
    - name: Publish
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/bundle/osx/macos-universal.zip
            target/release/bundle/osx/Rylus-*-universal.dmg
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64, arch]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Extract version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
    - name: Configure SSH for AUR
      env:
        AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
        chmod 600 ~/.ssh/aur
        cat > ~/.ssh/config <<EOF
        Host aur.archlinux.org
          IdentityFile ~/.ssh/aur
          User aur
          StrictHostKeyChecking accept-new
        EOF
    - name: Publish rylus (source)
      env:
        PKGVER: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        work=$(mktemp -d)
        git clone ssh://aur@aur.archlinux.org/rylus.git "$work/rylus"
        cp packaging/aur/PKGBUILD "$work/rylus/PKGBUILD"
        sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" "$work/rylus/PKGBUILD"
        sed -i "s/^pkgrel=.*/pkgrel=1/" "$work/rylus/PKGBUILD"
        ( cd "$work/rylus" && makepkg --printsrcinfo > .SRCINFO )
        cd "$work/rylus"
        git -c user.email="ci@rylus.invalid" -c user.name="Rylus CI" \
          add PKGBUILD .SRCINFO
        if ! git diff --cached --quiet; then
          git -c user.email="ci@rylus.invalid" -c user.name="Rylus CI" \
            commit -m "chore: bump to ${PKGVER}"
          git push
        fi
    - name: Publish rylus-bin (prebuilt)
      env:
        PKGVER: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        work=$(mktemp -d)
        git clone ssh://aur@aur.archlinux.org/rylus-bin.git "$work/rylus-bin"
        cp packaging/aur/PKGBUILD-bin "$work/rylus-bin/PKGBUILD"
        sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" "$work/rylus-bin/PKGBUILD"
        sed -i "s/^pkgrel=.*/pkgrel=1/" "$work/rylus-bin/PKGBUILD"
        ( cd "$work/rylus-bin" && makepkg --printsrcinfo > .SRCINFO )
        cd "$work/rylus-bin"
        git -c user.email="ci@rylus.invalid" -c user.name="Rylus CI" \
          add PKGBUILD .SRCINFO
        if ! git diff --cached --quiet; then
          git -c user.email="ci@rylus.invalid" -c user.name="Rylus CI" \
            commit -m "chore: bump to ${PKGVER}"
          git push
        fi

  build-windows:
    needs: [quality, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, windows, x64]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: x86_64-pc-windows-msvc
    - run: npm install
    - name: Build
      run: cargo build --release --target x86_64-pc-windows-msvc
      env:
        FFMPEG_DIR: C:\ffmpeg-win64
    - name: Package
      shell: pwsh
      run: |
        cd target\x86_64-pc-windows-msvc\release
        Compress-Archive -Path rylus.exe -DestinationPath rylus-windows.zip -Force
    - name: Artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: windows
        path: target/x86_64-pc-windows-msvc/release/rylus-windows.zip
    - name: Publish
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/x86_64-pc-windows-msvc/release/rylus-windows.zip
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
