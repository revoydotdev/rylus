name: Build

on:
  push:
    branches: [ '*' ]
    tags:
      - v*
  pull_request:
    branches: [ master ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpipewire-0.3-dev \
          libdbus-1-dev \
          libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
          libswscale-dev libswresample-dev \
          libwayland-dev libxkbcommon-dev \
          libdrm-dev libva-dev \
          pkg-config clang nasm
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-quality-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Rustfmt
      run: cargo fmt -- --check
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Audit
      run: cargo audit

  build-linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev libglu1-mesa-dev cmake git curl zip \
          libssl-dev gcc g++ autoconf libtool-bin pkg-config clang nasm \
          libpipewire-0.3-dev libdbus-1-dev \
          libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
          libswscale-dev libswresample-dev \
          libwayland-dev libxkbcommon-dev \
          libdrm-dev libva-dev \
          libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxi-dev libxcomposite-dev
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Install cargo-deb
      run: cargo install cargo-deb
    - name: Build
      run: ./docker_build.sh
      shell: bash
    - name: Artifacts1
      uses: actions/upload-artifact@v6
      with:
        name: linux
        path: packages/rylus-linux.zip
    - name: Artifacts2
      uses: actions/upload-artifact@v6
      with:
        name: linux-deb
        path: packages/Rylus*.deb
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            packages/rylus-linux.zip
            packages/Rylus*.deb
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-alpine:
    needs: quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build Alpine container
      run: docker build -t rylus-alpine-build -f docker/Dockerfile_alpine .
    - name: Build in container
      run: |
        docker run --rm -v ${{ github.workspace }}:/build -w /build rylus-alpine-build \
          sh -c "npm install && RUSTFLAGS='-C target-feature=-crt-static' cargo build --release && cd target/release && tar czf rylus-linux-alpine-musl.tar.gz rylus"
    - name: Artifacts1
      uses: actions/upload-artifact@v6
      with:
        name: linux-alpine-musl
        path: target/release/rylus-linux-alpine-musl.tar.gz
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/rylus-linux-alpine-musl.tar.gz
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: quality
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel] # -latest is for Apple Silicon, -15-intel is for Intel
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Download deps
      run: |
        npm install
        brew install nasm
        cargo install cargo-bundle
      shell: bash
    - name: Build
      # run: MACOSX_DEPLOYMENT_TARGET=10.13 cargo bundle --release
      run: cargo bundle --release
    - name: Package
      run: |
        MACOS_BUILD_NAME=macos-$([ "${{ matrix.os }}" == "macos-latest" ] && echo "arm" || echo "intel")
        echo "MACOS_BUILD_NAME=$MACOS_BUILD_NAME" >> $GITHUB_ENV
        cd target/release/bundle/osx/ && zip -r ${MACOS_BUILD_NAME}.zip Rylus.app
    - name: Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.MACOS_BUILD_NAME }}
        path: target/release/bundle/osx/${{ env.MACOS_BUILD_NAME }}.zip
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/bundle/osx/${{ env.MACOS_BUILD_NAME }}.zip
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: quality
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Install FFmpeg via vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        C:\vcpkg\vcpkg install ffmpeg[core,avcodec,avformat,avfilter,swscale,swresample]:x64-windows-static-md
      shell: cmd
    - name: Build
      run: cargo build --release
    - name: Package
      run: |
        cd target/release
        7z a rylus-windows.zip rylus.exe
      shell: bash
    - name: Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windows
        path: target/release/rylus-windows.zip
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/rylus-windows.zip
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
