name: Build

on:
  push:
    branches: [ '*' ]
    tags:
      - v*
  pull_request:
    branches: [ master ]

jobs:
  quality:
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v6
    - name: Install system dependencies
      if: ${{ !contains(runner.name, 'arch') }}
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpipewire-0.3-dev \
          libdbus-1-dev \
          libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
          libswscale-dev libswresample-dev \
          libwayland-dev libxkbcommon-dev \
          libdrm-dev libva-dev \
          pkg-config clang nasm
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-quality-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Rustfmt
      run: cargo fmt -- --check
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Audit
      run: cargo audit

  build-linux:
    needs: quality
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v6
    - name: Install system dependencies
      if: ${{ !contains(runner.name, 'arch') }}
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev libglu1-mesa-dev cmake git curl zip \
          libssl-dev gcc g++ autoconf libtool-bin pkg-config clang nasm \
          libpipewire-0.3-dev libdbus-1-dev \
          libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
          libswscale-dev libswresample-dev \
          libwayland-dev libxkbcommon-dev \
          libdrm-dev libva-dev \
          libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxi-dev libxcomposite-dev
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Install cargo-deb
      run: cargo install cargo-deb
    - name: Build
      run: ./docker_build.sh
      shell: bash
    - name: Artifacts1
      uses: actions/upload-artifact@v6
      with:
        name: linux
        path: packages/rylus-linux.zip
    - name: Artifacts2
      uses: actions/upload-artifact@v6
      with:
        name: linux-deb
        path: packages/rylus*.deb
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            packages/rylus-linux.zip
            packages/rylus*.deb
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-alpine:
    needs: quality
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v6
    - name: Build Alpine container
      run: docker build -t rylus-alpine-build -f docker/Dockerfile_alpine .
    - name: Build in container
      run: |
        docker run --rm -v ${{ github.workspace }}:/build -w /build \
          -e CARGO_HOME=/build/.cargo-docker \
          -e npm_config_cache=/build/.npm-cache \
          --user "$(id -u):$(id -g)" \
          rylus-alpine-build \
          sh -c "npm install && RUSTFLAGS='-C target-feature=-crt-static' cargo build --release && cd target/release && tar czf rylus-linux-alpine-musl.tar.gz rylus"
    - name: Artifacts1
      uses: actions/upload-artifact@v6
      with:
        name: linux-alpine-musl
        path: target/release/rylus-linux-alpine-musl.tar.gz
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/rylus-linux-alpine-musl.tar.gz
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64]
    env:
      VM_USER: ${{ vars.MACOS_VM_USER || 'builder' }}
      VM_PORT: ${{ vars.MACOS_VM_PORT || '2222' }}
      VM_SCRIPT: /mnt/games/VMs/vm-macos.sh
      SSH_OPTS: -o StrictHostKeyChecking=no -o LogLevel=ERROR
    steps:
    - uses: actions/checkout@v6
    - name: Start macOS VM
      run: $VM_SCRIPT start
    - name: Sync code to VM
      run: |
        rsync -az --delete \
          -e "ssh $SSH_OPTS -p $VM_PORT" \
          --exclude target --exclude node_modules --exclude .git \
          . $VM_USER@localhost:~/Rylus/
    - name: Build in VM
      run: |
        $VM_SCRIPT ssh 'source "$HOME/.cargo/env" && eval "$(/usr/local/bin/brew shellenv zsh)" && cd ~/Rylus && npm install && cargo bundle --release --package rylus-server'
    - name: Retrieve artifacts
      run: |
        mkdir -p target/release/bundle/osx
        scp $SSH_OPTS -P $VM_PORT \
          $VM_USER@localhost:~/Rylus/target/release/bundle/osx/Rylus.app/Contents/MacOS/rylus \
          target/release/bundle/osx/ || true
        ssh $SSH_OPTS -p $VM_PORT $VM_USER@localhost \
          'cd ~/Rylus/target/release/bundle/osx && zip -r /tmp/macos-intel.zip Rylus.app'
        scp $SSH_OPTS -P $VM_PORT \
          $VM_USER@localhost:/tmp/macos-intel.zip target/release/bundle/osx/
    - name: Stop macOS VM
      if: always()
      run: $VM_SCRIPT stop
    - name: Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: macos-intel
        path: target/release/bundle/osx/macos-intel.zip
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/bundle/osx/macos-intel.zip
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v6
    - run: npm install
    - name: Download FFmpeg Windows libs
      run: |
        if [ ! -d /mnt/games/VMs/ffmpeg-win64 ]; then
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-lgpl-shared-7.1.zip -o /tmp/ffmpeg.zip
          unzip -q /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract
          mv /tmp/ffmpeg-extract/ffmpeg-* /mnt/games/VMs/ffmpeg-win64
          rm -rf /tmp/ffmpeg.zip /tmp/ffmpeg-extract
        fi
    - name: Cross-compile for Windows
      run: cargo xwin build --release --target x86_64-pc-windows-msvc
      env:
        FFMPEG_DIR: /mnt/games/VMs/ffmpeg-win64
    - name: Package
      run: |
        cd target/x86_64-pc-windows-msvc/release
        zip rylus-windows.zip rylus.exe
    - name: Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windows
        path: target/x86_64-pc-windows-msvc/release/rylus-windows.zip
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/x86_64-pc-windows-msvc/release/rylus-windows.zip
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
