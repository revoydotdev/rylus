name: Build

on:
  push:
    branches: [ '*' ]
    tags:
      - v*
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-quality-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Rustfmt
      run: cargo fmt -- --check
    - name: Cargo test
      run: cargo test --workspace --locked
    - name: Encode benchmark regression gate
      run: ./scripts/bench-gate.sh
    - name: Frontend unit tests
      run: npm test
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Audit
      run: cargo audit

  build-linux:
    needs: quality
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Install cargo-deb
      run: cargo install cargo-deb
    - name: Build
      run: ./docker_build.sh
      shell: bash
    - name: Artifacts1
      uses: actions/upload-artifact@v6
      with:
        name: linux
        path: packages/rylus-linux.zip
    - name: Artifacts2
      uses: actions/upload-artifact@v6
      with:
        name: linux-deb
        path: packages/rylus*.deb
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            packages/rylus-linux.zip
            packages/rylus*.deb
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-alpine:
    needs: quality
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v6
    - name: Build Alpine container
      run: docker build -t rylus-alpine-build -f docker/Dockerfile_alpine .
    - name: Build in container
      run: |
        docker run --rm -v ${{ github.workspace }}:/build -w /build \
          -e CARGO_HOME=/build/.cargo-docker \
          -e npm_config_cache=/build/.npm-cache \
          --user "$(id -u):$(id -g)" \
          rylus-alpine-build \
          sh -c "npm install && RUSTFLAGS='-C target-feature=-crt-static' cargo build --release && cd target/release && tar czf rylus-linux-alpine-musl.tar.gz rylus"
    - name: Artifacts1
      uses: actions/upload-artifact@v6
      with:
        name: linux-alpine-musl
        path: target/release/rylus-linux-alpine-musl.tar.gz
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/rylus-linux-alpine-musl.tar.gz
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, macos, x64]
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        source "$HOME/.cargo/env"
        eval "$(/usr/local/bin/brew shellenv zsh)"
        npm install
        cargo bundle --release --package rylus-server
    - name: Package
      run: |
        cd target/release/bundle/osx
        zip -r macos-intel.zip Rylus.app
    - name: Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: macos-intel
        path: target/release/bundle/osx/macos-intel.zip
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/release/bundle/osx/macos-intel.zip
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64, arch]
    steps:
    - uses: actions/checkout@v6
    - name: Extract version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
    - name: Configure SSH for AUR
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
        chmod 600 ~/.ssh/aur
        cat > ~/.ssh/config <<EOF
        Host aur.archlinux.org
          IdentityFile ~/.ssh/aur
          User aur
          StrictHostKeyChecking accept-new
        EOF
    - name: Publish rylus (source)
      env:
        PKGVER: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        work=$(mktemp -d)
        git clone ssh://aur@aur.archlinux.org/rylus.git "$work/rylus"
        cp packaging/aur/PKGBUILD "$work/rylus/PKGBUILD"
        sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" "$work/rylus/PKGBUILD"
        sed -i "s/^pkgrel=.*/pkgrel=1/" "$work/rylus/PKGBUILD"
        ( cd "$work/rylus" && makepkg --printsrcinfo > .SRCINFO )
        cd "$work/rylus"
        git -c user.email="ci@rylus.invalid" -c user.name="Rylus CI" \
          add PKGBUILD .SRCINFO
        if ! git diff --cached --quiet; then
          git -c user.email="ci@rylus.invalid" -c user.name="Rylus CI" \
            commit -m "chore: bump to ${PKGVER}"
          git push
        fi
    - name: Publish rylus-bin (prebuilt)
      env:
        PKGVER: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        work=$(mktemp -d)
        git clone ssh://aur@aur.archlinux.org/rylus-bin.git "$work/rylus-bin"
        cp packaging/aur/PKGBUILD-bin "$work/rylus-bin/PKGBUILD"
        sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" "$work/rylus-bin/PKGBUILD"
        sed -i "s/^pkgrel=.*/pkgrel=1/" "$work/rylus-bin/PKGBUILD"
        ( cd "$work/rylus-bin" && makepkg --printsrcinfo > .SRCINFO )
        cd "$work/rylus-bin"
        git -c user.email="ci@rylus.invalid" -c user.name="Rylus CI" \
          add PKGBUILD .SRCINFO
        if ! git diff --cached --quiet; then
          git -c user.email="ci@rylus.invalid" -c user.name="Rylus CI" \
            commit -m "chore: bump to ${PKGVER}"
          git push
        fi

  build-windows:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, windows, x64]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    - run: npm install
    - name: Build
      run: cargo build --release --target x86_64-pc-windows-msvc
      env:
        FFMPEG_DIR: C:\ffmpeg-win64
    - name: Package
      shell: pwsh
      run: |
        cd target\x86_64-pc-windows-msvc\release
        Compress-Archive -Path rylus.exe -DestinationPath rylus-windows.zip -Force
    - name: Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windows
        path: target/x86_64-pc-windows-msvc/release/rylus-windows.zip
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: |
            target/x86_64-pc-windows-msvc/release/rylus-windows.zip
          prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
