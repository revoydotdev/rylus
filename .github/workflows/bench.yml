name: Bench

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-bench-cargo-${{ hashFiles('Cargo.lock') }}
    - name: Build bench binary
      run: cargo build --release -p rylus-encode --bin bench
    - name: Run latency budget bench
      run: ./target/release/bench
