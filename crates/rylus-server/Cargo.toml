[package]
name = "rylus-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Rylus server binary - use your tablet as a graphic tablet"

[[bin]]
name = "rylus"
path = "src/main.rs"

[features]
default = ["gui"]
bench = []
gui = ["dep:rylus-gui", "rylus-core/gui"]
x11 = ["rylus-capture/x11", "rylus-input/x11"]

[dependencies]
rylus-core = { workspace = true }
rylus-capture = { workspace = true }
rylus-encode = { workspace = true }
rylus-input = { workspace = true }
rylus-transport = { workspace = true }
rylus-gui = { workspace = true, optional = true }

argon2 = "0.5"
dirs = "^5.0"
parking_lot = { workspace = true }
bytes = "1.11"
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = "0.2"
handlebars = "^6.4"
http-body-util = "0.1.3"
hyper = { version = "^1.4", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rand = "0.8"
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
mdns-sd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = "0.3.17"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "^2.5"
hostname = "0.4"
if-addrs = "0.13"
time = "0.3"

[package.metadata.bundle]
name = "Rylus"
identifier = "net.freedesk.rylus"
icon = ["packaging/macos/icon.icns"]
copyright = "Copyright (c) 2025 The Rylus Contributors. All rights reserved."
category = "public.app-category.utilities"
short_description = "Use your tablet as a graphics tablet"
long_description = """
Rylus turns a tablet or secondary display into a graphics tablet or extended
screen for your desktop, streaming captured display frames and relaying
stylus/pen input back to the host in real time.
"""
osx_minimum_system_version = "11.0"
# osx_info_plist_exts appends the raw contents of the referenced file(s) into
# the generated Info.plist's <dict>, before it is closed. The referenced file
# injects the macOS TCC usage-description keys Rylus needs at runtime:
# NSScreenCaptureUsageDescription (Screen Recording, to capture the display)
# and NSAppleEventsUsageDescription (Apple Events, for input injection).
osx_info_plist_exts = ["packaging/macos/info-plist-extras.plist"]

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.9"
